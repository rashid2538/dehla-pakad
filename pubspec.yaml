name: dehla_pakad
description: "Dehla Pakad — Multiplayer Indian card game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: any

  # State management
  flutter_riverpod: any

  # Routing
  go_router: any

  # UI
  flutter_animate: any
  google_fonts: any

  # Utils
  uuid: any
  collection: any
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
